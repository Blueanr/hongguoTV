name: iOS 15 TrollStore IPA
on:
  workflow_dispatch:
  push:
    branches: [ios-native]
    paths:
      - 'ios-native/**'
      - 'scripts/build-ios.sh'
      - 'scripts/ios-icons.py'
      - '.github/workflows/ios-trollstore.yml'
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ios-native/tooling/package-lock.json
      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install Pillow==11.3.0
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build device IPA
        run: bash scripts/build-ios.sh
      - name: Simulator tests
        timeout-minutes: 12
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPad" in d["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project ios-native/HongguoPad.xcodeproj -scheme HongguoPad -destination "platform=iOS Simulator,id=$DEVICE" -destination-timeout 60 -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -derivedDataPath build/ios-simulator -resultBundlePath build/iOS-tests.xcresult CODE_SIGNING_ALLOWED=NO test
          xcrun simctl launch "$DEVICE" com.hongguotv.ipad
          xcrun simctl io "$DEVICE" screenshot outputs/ios/iPad-simulator.png
      - uses: actions/upload-artifact@v4
        with:
          name: HongguoTV-iOS15-TrollStore
          path: |
            outputs/ios/*.ipa
            outputs/ios/SHA256SUMS.txt
            outputs/ios/iPad-simulator.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-test-diagnostics
          path: build/iOS-tests.xcresult
