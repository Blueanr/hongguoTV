name: HongguoPad
options:
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '0.16.13'
    CURRENT_PROJECT_VERSION: '4'
packages:
  Openhongguo:
    url: https://github.com/beilunyang/openhongguo.git
    exactVersion: 0.4.0
targets:
  HongguoPad:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongguotv.ipad
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Openhongguo
      - sdk: AVKit.framework
      - sdk: JavaScriptCore.framework
      - sdk: libz.tbd
  HongguoPadTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongguotv.ipad.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HongguoPad
      - package: Openhongguo
schemes:
  HongguoPad:
    build:
      targets:
        HongguoPad: all
    test:
      targets: [HongguoPadTests]
